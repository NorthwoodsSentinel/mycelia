# CI for mycelia (NOR-389). It replaces .github/workflows/ci.yml, whose three
# jobs (vitest, tsc strict, wrangler dry-run build) are all stages of
# `validate` below; that file's actions were on moving tags, which the pin
# guard now refuses in every job.
#
# Adapted for this repo from the MCP Inspector's CI workflow
# (modelcontextprotocol/inspector at d330df96, .github/workflows/main.yml,
# blob c1eeb58a6775d95cce43f6f99fc09cfec2dfccc1); record: PROVENANCE-CHECK.md.
# It keeps the source's shape: the same file name and
# workflow name, the same least-privilege `permissions`, one pinned runtime
# version stated once, and a `timeout-minutes` on the job. Where this file
# differs from the source's, the reason is beside the line.
#
# One job runs every stage of `npm run local:gate`, the command a developer
# runs before pushing, except `local:dco`: `validate` (pin guard, the guards'
# own tests, format check, lint, typecheck and its coverage guard, Vitest
# tests, the dry-run build), then `coverage` (per-file coverage and its scope
# guard). There is no `smoke` stage: this repo is an HTTP API Worker, not an
# MCP server, so the Inspector has nothing here to connect to. `local:dco`
# reads `origin/main`, which this shallow checkout does not have, so it stays
# local (the Inspector's reason, its docs/quality-gate.md:59); a pull
# request's commits are checked by .github/workflows/dco.yml instead.
#
# This workflow holds no secret and can write nothing. It deploys nothing:
# `build` is wrangler's `--dry-run`, which bundles the Worker locally and never
# contacts Cloudflare. Deploying the Worker is the owner's act (AGENTS.md,
# Cloudflare work).
#
# Limits, accepted: a pull request that edits this
# file, or the scripts it runs, is judged by the edited version (as in the
# Inspector; the control is review of the diff). The check is not REQUIRED for
# merging until the owner adds a repository ruleset; the job name `validate`
# below is the name that ruleset will match, so rename both together or not
# at all.

name: CI

on:
  # `pull_request`, not `pull_request_target`: the workflow runs from the pull
  # request's own revision with a read-only token and no secret.
  # No branch or path filter: a required check that a filter skips would stay
  # "expected" forever.
  pull_request:
  # The Inspector uses a bare `push:`. Here that would run every pull request
  # branch twice (once for the push, once for the pull request), so pushes are
  # limited to the branch pull requests merge into.
  push:
    branches: [main]

# A newer push to the same branch or pull request supersedes an in-flight run
# (kept from this repo's ci.yml).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN (the Inspector's block, verbatim). Without
# it the job would inherit the repository's default token permissions.
permissions:
  contents: read

env:
  # The one pinned runtime, stated once (the Inspector's pattern for its npm
  # pin). 1.3.6 is the Bun version this repo's ci.yml pinned; kept, not raised,
  # because bun.lock installs under it today.
  CI_BUN_VERSION: "1.3.6"
  # `build` runs wrangler on every run; this documented system variable turns
  # its telemetry off (Cloudflare docs, "System environment variables",
  # read 2026-11-14).
  WRANGLER_SEND_METRICS: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    # PROVISIONAL: no run of this workflow had been observed when it was
    # written. The rule is roughly twice the slowest observed run, rounded up
    # to the next five minutes. The only measurement so far is local: the
    # stages took about a minute on a developer Mac once installed. 10 minutes
    # is a provisional value, a hung-job guard, not a
    # flake remedy. Re-size it from observed runs, with the range. Vitest's
    # per-test budget (30 s, vitest.config.ts) is far smaller, so it fires
    # first.
    timeout-minutes: 10

    steps:
      # Every action is pinned to a commit SHA with its exact release, in
      # every job of this repo; `npm run verify:action-pins` enforces it. The
      # SHAs and releases were each read from one tag lookup for NOR-389
      # (2026-11-15; PROVENANCE-CHECK.md).
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; do not leave the token in the checkout.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          # No `cache: npm` (the Inspector has it): the install is small, and
          # a cache is one more thing that can differ between runs.

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.CI_BUN_VERSION }}

      - name: Install dependencies
        # From this repo's lockfile (bun.lock). Not `--ignore-scripts`: The integration tests' D1 adapter needs
        # better-sqlite3's native build, and package.json's
        # `trustedDependencies` names it as the one dependency whose install
        # script Bun runs (this repo's ci.yml did the same).
        run: bun install --frozen-lockfile

      - name: Run the gate (every stage of local:gate but the local-only local:dco)
        run: npm run validate && npm run coverage
