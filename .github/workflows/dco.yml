# DCO signoff check (#2566), replacing the probot DCO app.
#
# The app was suspended and its check silently stopped appearing after #1981
# (2026-08-12). Nothing went red, because it was never a required check — so
# for two months "the DCO check is a hard merge gate" was true only by habit.
# This workflow is the repo-owned replacement: `scripts/dco-check.mjs` fails
# unless every commit in a range carries a `Signed-off-by:` matching its
# author or committer (merge and bot-authored commits exempt — the app's rule).
#
# Two jobs, one script:
#
#   - `DCO` — on every PR, over the PR's commits. It is made a REQUIRED
#     status check on `main` by a repository ruleset on `main` (not yet in
#     this repo: NOR-356; setting it is the owner's act), not by this
#     file — no workflow can make itself required. That ruleset is to pin the
#     check to GitHub Actions (integration 15368), so a commit status posted by
#     hand under the name `DCO` cannot satisfy it. ⚠️ Renaming
#     this job renames the check, and the ruleset would then wait forever on a
#     name nothing reports: change both together.
#   - `DCO (main push)` — a backstop over every push that lands on
#     `main`, for whatever reached the branch without a passing PR check
#     while this file and the script stayed intact: an admin merge, a direct
#     push, a merge made while the PR check was red or missing. NOT a PR that
#     edited the check itself (below).
#     It reports when the commit lands, not one milestone later — it cannot
#     un-merge anything, but an unsigned commit found the same day is still
#     cheap to deal with.
#
# ⚠️ `pull_request`, not `pull_request_target` (#2616). #2603 shipped on
# `pull_request_target` so a PR could not rewrite its own check to pass — but
# GitHub reads `pull_request_target` workflows from the DEFAULT branch
# (`main`), so the check reported on no v2 PR at all until a milestone merge
# carried this file there, and unsigned commits would have surfaced only when
# the milestone PR into `main` was opened. Under `pull_request` the workflow
# runs from the PR's own ref and works the moment it is on `v2/main`, and an
# edit to this file takes effect on the PR that makes it.
#
# The trade-off, accepted deliberately: a PR can now edit this file to pass
# itself. That is tolerable here because the owner picks the work and an
# agent merges only with the required checks green and Codex's final audit
# clean (AGENTS.md, Contributing), and the check exists to catch a FORGOTTEN signoff,
# not a forged one — the trailer is self-asserted text either way (see the
# header of `scripts/dco-check.mjs`). ⚠️ The push job does NOT cover that
# case: a `push` run also reads this file, and runs the script, from the
# pushed revision — so a PR that edits the check edits the backstop with it.
# Nothing in a workflow the repo's own branches carry can close that; only a
# check read from elsewhere could, which is what `pull_request_target` was and
# what this change gives up. The control for it is review: an edit to this
# file or to `scripts/dco-check.mjs` is in the PR's diff. The PR job keeps the
# trigger safe anyway: it checks out the PR's BASE for the script and only
# FETCHES the PR's commits, reading their metadata with `git log` — nothing
# from the PR is checked out, installed, built or run.
#
# In this repo the PR job runs on EVERY base, with no branch filter. The
# source filters to its `v2/**` line so that a stacked PR is checked on its
# own range while its release branch and v1 line stay out; this repo has one
# long-lived branch, `main` (the develop branch, AGENTS.md branch table), and
# no release line, so checking every base keeps his stacked-PR reason and
# drops a filter with nothing to exclude. It also matches main.yml, which has
# no filter. A PR's base must already contain `scripts/dco-check.mjs`, since
# the script is read from it; a base without it fails red, never green.
# `edited` re-runs the PR job when a PR is retargeted, since the checked range
# changes with the base even when the head does not.
#
# Before either job, `npm run local:gate` runs the same script over
# `origin/main..HEAD` (`local:dco`), so an unsigned commit is normally caught
# before it is pushed at all. CI's gate (main.yml) does not run `local:dco`:
# its shallow checkout has no `origin/main`.
#
# Only `contents: read` and no secret. Every action is pinned to a commit
# with its exact release, as in every job of this repo (AGENTS.md, the pin
# rule; `npm run verify:action-pins` enforces it). Each SHA and release came
# from one tag lookup, 2026-11-14.
#
# Copied from modelcontextprotocol/inspector at commit
# d330df9617e44ec893bc1a53618662239342d433, .github/workflows/dco.yml (blob
# 360fe4f17c2233f041549e60128becd57f5c95b1), by copy then edit. His reasoning
# on `pull_request` versus `pull_request_target` above is kept as written; the
# issue numbers in it are his repo's. Every edit is listed in
# docs/DESIGN-nor-349-signoff.md, section 3; record: PROVENANCE-CHECK.md.
#
# In fleet-mcp (NOR-357): copied from NorthwoodsSentinel/walle origin/main
# 5fb8747, .github/workflows/dco.yml (blob
# 83356971c4352fe1d27fd4c62d74b61a3fa43ef7). The design named above is
# WALL-E's, kept verbatim in docs/. Edits, comments only: the ruleset
# paragraph (this repo has none yet, NOR-356), who merges (this repo's
# Contributing rule), where `main`'s role is recorded, the push step's
# ruleset remark, and this paragraph.
# Triggers, jobs, steps and pins are WALL-E's unchanged. The push job's range
# is `before..after`, so the unsigned commits from before this repo's rules
# file, all reachable from `before`, are never in it. Record:
# PROVENANCE-CHECK.md, section 4.
#
# In mycelia (NOR-389): copied from NorthwoodsSentinel/fleet-mcp origin/main
# f1bea96, .github/workflows/dco.yml (blob
# 9d3165be6059d7798e32719ccb1510ba5db2294c). One edit: the PR job's checkout
# returns to the source's `persist-credentials: false` (this repo is public,
# as the source is). Everything else is fleet-mcp's: triggers, jobs, steps and
# pins. The ruleset that makes `DCO` required is the owner's act and does not
# exist in this repo yet; the "NOR-356" references above are fleet-mcp's
# ticket for its own ruleset. "AGENTS.md, Contributing" applies here as this
# repo's AGENTS.md states it. Record: PROVENANCE-CHECK.md.
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A newer push to the same PR supersedes the range being checked. Job-level
    # and PR-keyed on purpose: the push job below must NOT share it, since a
    # cancelled push run is a range that is never checked.
    concurrency:
      group: dco-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # A git fetch, a git log and a node script; expected to finish well inside
    # a minute. Not yet observed on a runner — revisit with the measured range
    # per the rule in AGENTS.md (CI timeouts) once it has a history.
    timeout-minutes: 5

    steps:
      - name: Checkout the base branch with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
          # mycelia (NOR-389): back to the source's `persist-credentials:
          # false`. fleet-mcp set `true` because it is private and the next
          # step's `git fetch origin` needed the credential; this repo is
          # public, like the source, so the fetch needs none. A failed fetch
          # fails the step: red, never green.
          persist-credentials: false

      - name: Fetch the PR's commits (read as data, never checked out)
        # `refs/pull/<N>/head` serves fork PRs too. Values pass through `env:`
        # rather than being interpolated into the script.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'

      - name: Check every commit is signed off
        # The base is the branch as it stands now (`origin/<base_ref>`), not
        # the event's `base.sha`, so commits that have since landed on the
        # base are excluded exactly as the PR's own commit list excludes them.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/dco-check.mjs --base "origin/$BASE_REF" --head "$HEAD_SHA"

  dco-push:
    name: DCO (main push)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Same work as the PR job; same unmeasured budget.
    timeout-minutes: 5

    steps:
      - name: Checkout the pushed commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'

      - name: Check every pushed commit is signed off
        # `before..after` is exactly what the push added: for a PR merge, the
        # merge commit (exempt) plus every commit it brought in. A zero
        # `before` means the branch was just created, which leaves no range to
        # check. A `before` missing from the history (a force-push that
        # rewrote it away) makes `git log` fail and the script exit 2 — loud
        # on purpose, since `main` is never meant to be rewritten (no ruleset
        # blocks a force-push on it in this repo yet: NOR-356).
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Branch creation push: no prior commit, nothing to check."
            exit 0
          fi
          node scripts/dco-check.mjs --base "$BEFORE" --head "$AFTER"
