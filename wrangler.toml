name = "mycelia-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "359bbec67c35603c232096900443f5f5"

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"
# ADMIN_OWNER_ID — owner_id authorized for revoke/unrevoke admin actions.
# (Preserves pre-merge hardcoded admin from routes/agents.ts.)
ADMIN_OWNER_ID = "rob-chuvala"
# MODE — trust-enforcement spectrum. REQUIRED. Node refuses to start without a valid value.
# 'community' = open/public, full trust system load-bearing. Default for public nodes.
# 'company'   = private org node; community trust rules + fleet registration/feed scoping.
# 'fleet'     = single principal's own agents; trust implicit, revocation is the control.
# See src/middleware/fleet-gate.ts for the full feature matrix.
# This node is Rob's own fleet bus → fleet mode.
MODE = "fleet"
# H5: public RFC 7638 thumbprint of the admin Ed25519 key (private half in 1P Fleet-Shared "Mycelia ADMIN_POP_KEY"). Admin routes require a DPoP proof under it.
ADMIN_POP_JKT = "U42NCbxwl2Lox_1Hz5VfEdFgyyifRCJkF_Sdxuo7kGc"

[[d1_databases]]
binding = "DB"
database_name = "mycelia-db"
database_id = "2d0fcc8f-388d-438f-84de-fa819b67a929"

[[kv_namespaces]]
binding = "KV"
id = "4be87b971aa44128a9f2cdeccd4306b8"


# Service Bindings — directed-synchronous fleet RPC (Step 5 2026-05-18)
# 3 of 4 workers wired: mirror, gemini, mistral. Brook deferred (DO, different shape).
# Spec: docs/specs/WORKER_ENTRYPOINT_SHAPE.md
[[services]]
binding = "MIRROR"
service = "mirror-worker"
entrypoint = "MirrorApi"

[[services]]
binding = "GEMINI"
service = "gemini-worker"
entrypoint = "GeminiApi"

[[services]]
binding = "MISTRAL"
service = "mistral-worker"
entrypoint = "MistralApi"


# Cron trigger for timeouts/expiry
[triggers]
crons = ["*/15 * * * *"]

[env.dev]
name = "mycelia-dev"
# Wrangler env vars do NOT inherit top-level [vars]: dev needs its own ADMIN_POP_JKT or every admin call is a 503 by design.
[env.dev.vars]
ADMIN_POP_JKT = "REPLACE_WITH_DEV_ADMIN_KEY_THUMBPRINT"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "mycelia-dev"
database_id = "<your-dev-d1-database-id>"

[[env.dev.kv_namespaces]]
binding = "KV"
id = "<your-dev-kv-namespace-id>"

[[env.dev.r2_buckets]]
binding = "R2_AUDIT"
bucket_name = "mycelia-audit-dev"

[env.dev.vars]
ENVIRONMENT = "dev"
# Fleet owner_id — owner who can admin/revoke agents on this node.
ADMIN_OWNER_ID = "<your-dev-admin-owner-id>"
# MODE for dev node — set to 'fleet' to run as a dedicated fleet node.
MODE = "community"
